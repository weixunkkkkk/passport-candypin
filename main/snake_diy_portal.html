<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="album-token" content="PASSPORT_TOKEN">
<title>CandyPin DIY 像素画</title>
<style>
:root{color-scheme:dark;background:#191612;color:#fff0d7;font:16px/1.5 system-ui,sans-serif}
body{max-width:29rem;margin:1.6rem auto;padding:0 1.2rem}
a{color:#ffd078}h1{margin:.9rem 0 .15rem;font-size:1.8rem}p{color:#d6bea4;margin:.35rem 0 1rem}
canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;image-rendering:pixelated;background:#2a2029;border-radius:.6rem}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:.9rem 0}
label{display:block;color:#f2dec3;margin-bottom:.35rem}
input,select,button{font:inherit;width:100%;min-height:44px;border-radius:.5rem;box-sizing:border-box}
input,select{padding:.5rem;background:#31251e;color:#fff0d7;border:1px solid #795e48}
button{margin-top:.25rem;background:#ffc444;color:#26190d;border:0;font-weight:650}
button:disabled{opacity:.5}#status{min-height:3rem;margin-top:.7rem}.note{font-size:.9rem}
</style>
<a href="/">返回连接设置</a>
<h1>DIY 像素画</h1>
<p>选照片，预览效果，再选一个画位保存。</p>
<canvas id="preview" width="48" height="30" aria-label="像素画预览"></canvas>
<label for="photo">选择照片</label>
<input id="photo" type="file" accept="image/*">
<div class="controls">
  <div><label for="fit">画面裁切</label><select id="fit"><option value="crop">填满画框</option><option value="contain">保留整张</option></select></div>
  <div><label for="slot">保存到</label><select id="slot"><option value="1">画位 1</option><option value="2">画位 2</option><option value="3">画位 3</option></select></div>
</div>
<button id="save" disabled>保存到 Passport</button>
<p id="status" role="status" aria-live="polite">浏览器会把照片转为 48×30、最多 32 色。Passport 只接收像素画。</p>
<p class="note">同一画位会替换。保存后在 Passport 上长按 OK 关热点，再到 DIY 卡长按上键换图。</p>
<script>
const WIDTH=48, HEIGHT=30, COLORS=32, INDEX=4+COLORS*2;

function colorBox(raw, ids) {
  const lo=[255,255,255], hi=[0,0,0];
  for(const i of ids) for(let c=0;c<3;c++){
    const n=raw[i*4+c];
    lo[c]=Math.min(lo[c],n); hi[c]=Math.max(hi[c],n);
  }
  const range=hi.map((n,i)=>n-lo[i]);
  const axis=range.indexOf(Math.max(...range));
  return {ids,axis,weight:range[axis]*ids.length};
}

function encode(raw) {
  const groups=[colorBox(raw,Array.from({length:WIDTH*HEIGHT},(_,i)=>i))];
  while(groups.length<COLORS){
    let best=0;
    for(let i=1;i<groups.length;i++) if(groups[i].weight>groups[best].weight) best=i;
    const {ids,axis,weight}=groups[best];
    if(!weight) break;
    ids.sort((a,b)=>raw[a*4+axis]-raw[b*4+axis]);
    const half=ids.length>>1;
    groups.splice(best,1,colorBox(raw,ids.slice(0,half)),colorBox(raw,ids.slice(half)));
  }
  const packet=new Uint8Array(INDEX+WIDTH*HEIGHT);
  packet.set([80,88,48,49]);
  groups.forEach(({ids},i)=>{
    const sum=[0,0,0];
    for(const p of ids) for(let c=0;c<3;c++) sum[c]+=raw[p*4+c];
    const [r,g,b]=sum.map(n=>Math.round(n/ids.length));
    const rgb=(Math.round(r*31/255)<<11)|(Math.round(g*63/255)<<5)|Math.round(b*31/255);
    packet[4+i*2]=rgb&255; packet[5+i*2]=rgb>>8;
    for(const p of ids) packet[INDEX+p]=i;
  });
  return packet;
}

function decode(packet, raw) {
  for(let i=0;i<WIDTH*HEIGHT;i++){
    const at=4+packet[INDEX+i]*2, rgb=packet[at]|packet[at+1]<<8;
    raw[i*4]=(rgb>>11)*255/31;
    raw[i*4+1]=((rgb>>5)&63)*255/63;
    raw[i*4+2]=(rgb&31)*255/31;
    raw[i*4+3]=255;
  }
}

const $=id=>document.getElementById(id);
const ctx=$('preview').getContext('2d',{willReadFrequently:true});
const token=document.querySelector('meta[name=album-token]').content;
let source, packet, selection=0, uploading=false;

function refresh(){
  if(!source) return;
  const scales=[WIDTH/source.naturalWidth,HEIGHT/source.naturalHeight];
  const scale=$('fit').value==='crop'?Math.max(...scales):Math.min(...scales);
  const w=source.naturalWidth*scale, h=source.naturalHeight*scale;
  ctx.fillStyle='#241a24'; ctx.fillRect(0,0,WIDTH,HEIGHT);
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(source,(WIDTH-w)/2,(HEIGHT-h)/2,w,h);
  const frame=ctx.getImageData(0,0,WIDTH,HEIGHT);
  packet=encode(frame.data);
  decode(packet,frame.data);
  ctx.putImageData(frame,0,0);
  $('save').disabled=uploading;
  $('status').textContent='已生成像素画，可以保存。';
}

$('fit').addEventListener('change',refresh);
$('photo').addEventListener('change',()=>{
  const id=++selection, file=$('photo').files[0];
  source=packet=null; $('save').disabled=true;
  if(!file) return;
  if(file.size>20*1024*1024){$('status').textContent='请选择 20 MB 以内的照片。';return;}
  const src=URL.createObjectURL(file), next=new Image();
  $('status').textContent='正在读取照片…';
  next.onload=()=>{
    URL.revokeObjectURL(src);
    if(id!==selection) return;
    source=next; refresh();
  };
  next.onerror=()=>{
    URL.revokeObjectURL(src);
    if(id===selection) $('status').textContent='无法读取这张照片，请试试 JPEG 或 PNG。';
  };
  next.src=src;
});
$('save').addEventListener('click',async()=>{
  if(!packet||uploading) return;
  uploading=true; $('save').disabled=true;
  const slot=$('slot').value;
  $('status').textContent='正在保存到画位 '+slot+'…';
  try{
    const res=await fetch('/diy/image?slot='+slot,{
      method:'POST',headers:{'Content-Type':'application/octet-stream','X-Album-Token':token},body:packet
    });
    $('status').textContent=await res.text();
  }catch{
    $('status').textContent='保存连接中断，请确认手机仍连接 Passport 热点。';
  }finally{
    uploading=false; $('save').disabled=!packet;
  }
});
</script>
</html>
